<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>A Moment of Light</title>
    <meta name="description" content="A deliberately minimal reader that surfaces one short poem at a time from a curated collection. One poem per visit.">
    <link rel="alternate" type="text/markdown" href="index.md">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1 class="visually-hidden">A Moment of Light</h1>
        <div class="poem-wrapper">
            <div id="poem" class="poem"></div>
            <cite id="author" class="author"></cite>
        </div>
        <button id="newPoem" class="new-poem" aria-label="New poem">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
        </button>
    </main>
    <script src="script.js"></script>
</body>
</html>
